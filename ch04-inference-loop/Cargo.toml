# Cargo.toml for llm-rs
[package]
name = "llm-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
candle-core = { version = "0.11", features = ["cuda"] }
candle-nn = "0.11"
candle-transformers = "0.11"
tokenizers = "0.21"
serde = { version = "1.0", features = ["derive"] }

# Only needed for the Criterion benchmark in the "Benchmarking" section:
[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "bench_attention"
harness = false
